name: Local CPU model experiment

# A bounded benchmark of code IN THIS REPOSITORY, not an inference service.
# Standard GitHub-hosted Ubuntu runners are free for public repositories.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Local Ollama model (CPU, quantized)"
        type: choice
        required: true
        default: "qwen3:4b-instruct"
        options:
          - "qwen3:4b-instruct"
          - "qwen3:1.7b"
          - "qwen2.5-coder:1.5b"
      variant:
        description: "Prompt-only architecture reviews or two scoped R1/R2 checks"
        type: choice
        required: true
        default: "scoped-contracts"
        options:
          - "scoped-contracts"
          - "architecture-review"
          - "both"
      scenario:
        description: "Architecture fixture to test"
        type: choice
        required: true
        default: "both"
        options:
          - "both"
          - "flawed"
          - "control"
  # Run one first experiment upon introducing this workflow.
  # Later runs are manual, so model downloads do not happen on ordinary pushes.
  push:
    branches: [main]
    paths: [".github/workflows/local-cpu-model.yml"]

permissions:
  contents: read

concurrency:
  group: local-cpu-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      EGG_MODEL: ${{ inputs.model || 'qwen3:4b-instruct' }}
      EGG_SCENARIO: ${{ inputs.scenario || 'both' }}
      EGG_VARIANT: ${{ inputs.variant || 'scoped-contracts' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local experiment package
        run: python -m pip install --no-deps -e .
      - name: Install Ollama for CPU inference
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
      - name: Start local-only Ollama service
        run: |
          set -euo pipefail
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Local Ollama is available on loopback"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1
      - name: Download CPU-sized local weights
        run: |
          set -euo pipefail
          ollama pull "$EGG_MODEL"
          ollama list
      - name: Run ungraded direct and contract-guided reviews
        if: ${{ env.EGG_VARIANT == 'architecture-review' || env.EGG_VARIANT == 'both' }}
        run: |
          set -euo pipefail
          python -m egg.local_llm --model "$EGG_MODEL" --scenario "$EGG_SCENARIO" --output results/local-cpu
      - name: Run four public scoped checks (R1 and R2)
        if: ${{ env.EGG_VARIANT == 'scoped-contracts' || env.EGG_VARIANT == 'both' }}
        run: |
          set -euo pipefail
          python -m egg.scoped_checks --model "$EGG_MODEL" --output results/local-scoped
      - name: Upload small reproducibility artifacts (no weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-cpu-experiment-results
          path: |
            results/local-cpu/
            results/local-scoped/
          if-no-files-found: warn
          retention-days: 3
      - name: Report Ollama log when failing
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/ollama.log" || true
# Prompt-only comparison runs are independent from the native five-framework evaluation.
# Re-run the scoped fixture after correcting its clean-control header.
